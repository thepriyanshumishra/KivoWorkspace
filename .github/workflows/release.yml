name: Kivo Workspace Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  # ============================================================
  # JOB 1 · Windows → KivoWorkspace-Windows.exe
  # ============================================================
  build-windows:
    name: Windows (.exe)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.x'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies & PyInstaller
        shell: pwsh
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -r requirements_ci.txt
          python -m pip install pyinstaller

      - name: Build backend (Windows x64)
        shell: pwsh
        run: |
          cd backend
          pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Flutter pub get
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter Windows app
        shell: pwsh
        run: |
          cd frontend
          flutter build windows --release

      - name: Copy backend into Flutter release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "frontend\build\windows\x64\runner\Release\bin" -Force
          Copy-Item -Path "backend\dist\kivo_backend" `
                    -Destination "frontend\build\windows\x64\runner\Release\bin\" `
                    -Recurse -Force

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "frontend\windows\installer.iss"

      - name: Rename installer to release filename
        shell: pwsh
        run: |
          Copy-Item "frontend\build\windows\KivoWorkspace-Setup.exe" `
                    "KivoWorkspace-Windows.exe" -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: KivoWorkspace-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 2 · Linux → .deb  .rpm  .AppImage
  # ============================================================
  build-linux:
    name: Linux (.deb/ .rpm/ .appimage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.x'

      - name: Enable Linux desktop & install system dependencies
        run: |
          flutter config --enable-linux-desktop
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            alien wget rpm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies & PyInstaller
        run: |
          cd backend
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements_ci.txt
          .venv/bin/pip install pyinstaller

      - name: Build backend (Linux x86_64)
        run: |
          cd backend
          .venv/bin/pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Flutter pub get
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter Linux app
        run: |
          cd frontend
          flutter build linux --release

      - name: Copy backend into Flutter release bundle
        run: |
          mkdir -p frontend/build/linux/x64/release/bundle/bin
          cp -R backend/dist/kivo_backend frontend/build/linux/x64/release/bundle/bin/

      - name: Build .deb package
        run: |
          BUNDLE="frontend/build/linux/x64/release/bundle"
          PKG="deb_staging"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/share/kivo-workspace" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/pixmaps"
          cp -R "$BUNDLE/." "$PKG/usr/share/kivo-workspace/"
          printf '#!/bin/sh\nexec /usr/share/kivo-workspace/kivo_workspace "$@"\n' > "$PKG/usr/bin/kivo-workspace"
          chmod +x "$PKG/usr/bin/kivo-workspace"
          printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Kivo Workspace\nComment=Edge-first AI Knowledge Workspace\nExec=/usr/bin/kivo-workspace\nIcon=kivo-workspace\nCategories=Utility;\nTerminal=false\n' > "$PKG/usr/share/applications/kivo-workspace.desktop"
          cp frontend/assets/images/app_logo.png "$PKG/usr/share/pixmaps/kivo-workspace.png"
          printf 'Package: kivo-workspace\nVersion: 1.0.0\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: Kivo <support@kivo.com>\nDescription: Edge-first AI Knowledge Workspace\n An intelligent workspace that runs entirely on-device.\n' > "$PKG/DEBIAN/control"
          dpkg-deb --build "$PKG" KivoWorkspace-Linux.deb

      - name: Build .rpm package (via alien)
        run: |
          sudo alien --to-rpm --scripts KivoWorkspace-Linux.deb
          RPM_FILE=$(ls kivo-workspace*.rpm 2>/dev/null | head -1)
          if [ -z "$RPM_FILE" ]; then echo "ERROR: .rpm not found" && exit 1; fi
          mv "$RPM_FILE" KivoWorkspace-Linux.rpm

      - name: Build .AppImage
        run: |
          BUNDLE="frontend/build/linux/x64/release/bundle"
          APPDIR="AppDir"
          mkdir -p "$APPDIR"
          cp -R "$BUNDLE/." "$APPDIR/"
          printf '#!/bin/sh\nSELF=$(readlink -f "$0")\nHERE=$(dirname "$SELF")\nexec "$HERE/kivo_workspace" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Kivo Workspace\nComment=Edge-first AI Knowledge Workspace\nExec=AppRun\nIcon=kivo-workspace\nCategories=Utility;\nTerminal=false\n' > "$APPDIR/kivo-workspace.desktop"
          cp frontend/assets/images/app_logo.png "$APPDIR/kivo-workspace.png"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" KivoWorkspace-Linux.AppImage

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            KivoWorkspace-Linux.deb
            KivoWorkspace-Linux.rpm
            KivoWorkspace-Linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 3 · macOS Silicon → KivoWorkspace-macOS-Silicon.dmg
  # ============================================================
  build-macos-silicon:
    name: macOS Silicon
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.x'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies & PyInstaller (arm64)
        run: |
          cd backend
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements_ci.txt
          .venv/bin/pip install pyinstaller

      - name: Build backend with PyInstaller (arm64)
        run: |
          cd backend
          .venv/bin/pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Flutter pub get
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter macOS app
        run: |
          cd frontend
          flutter build macos --release

      - name: Embed backend into app bundle
        run: |
          APP="frontend/build/macos/Build/Products/Release/Kivo Workspace.app"
          mkdir -p "$APP/Contents/Resources/bin"
          cp -R backend/dist/kivo_backend "$APP/Contents/Resources/bin/"

      - name: Re-sign app bundle (fixes macOS Gatekeeper "damaged" error)
        run: |
          APP="frontend/build/macos/Build/Products/Release/Kivo Workspace.app"
          codesign --force --deep --sign - "$APP"

      - name: Create Silicon DMG
        run: |
          APP="frontend/build/macos/Build/Products/Release/Kivo Workspace.app"
          STAGING="dmg_staging_silicon"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -fs HFS+ \
            -srcfolder "$STAGING" \
            -volname "Kivo Workspace" \
            -format UDZO \
            KivoWorkspace-macOS-Silicon.dmg

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: KivoWorkspace-macOS-Silicon.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 4 · macOS Intel → KivoWorkspace-macOS-Intel.dmg
  # ============================================================
  build-macos-intel:
    name: macOS Intel
    runs-on: [self-hosted, macos, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.x'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Verify System Python
        run: |
          python3 --version
          pip3 --version

      - name: Install backend dependencies & PyInstaller
        run: |
          cd backend
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements_ci.txt
          .venv/bin/pip install pyinstaller

      - name: Build backend with PyInstaller
        run: |
          cd backend
          .venv/bin/pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Flutter pub get
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter macOS app
        run: |
          cd frontend
          flutter build macos --release

      - name: Embed backend into app bundle
        run: |
          APP="frontend/build/macos/Build/Products/Release/Kivo Workspace.app"
          mkdir -p "$APP/Contents/Resources/bin"
          cp -R backend/dist/kivo_backend "$APP/Contents/Resources/bin/"

      - name: Re-sign app bundle (fixes macOS Gatekeeper "damaged" error)
        run: |
          APP="frontend/build/macos/Build/Products/Release/Kivo Workspace.app"
          codesign --force --deep --sign - "$APP"

      - name: Create Intel DMG
        run: |
          APP="frontend/build/macos/Build/Products/Release/Kivo Workspace.app"
          STAGING="dmg_staging_intel"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -fs HFS+ \
            -srcfolder "$STAGING" \
            -volname "Kivo Workspace" \
            -format UDZO \
            KivoWorkspace-macOS-Intel.dmg

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: KivoWorkspace-macOS-Intel.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
