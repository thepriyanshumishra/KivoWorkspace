name: Kivo Workspace Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  # ============================================================
  # JOB 0 · Build Flutter Web Assets (Compiled Once)
  # ============================================================
  build-web:
    name: Flutter Web Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.x'

      - name: Flutter pub get
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter Web App
        run: |
          cd frontend
          flutter build web --release

      - name: Upload Web Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivo_web_assets
          path: frontend/build/web/

  # ============================================================
  # JOB 1 · Windows → KivoWorkspace-Windows.exe
  # ============================================================
  build-windows:
    name: Windows (.exe)
    runs-on: windows-2022
    needs: [build-web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.x'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies & PyInstaller
        shell: pwsh
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -r requirements_ci.txt
          python -m pip install pyinstaller

      - name: Build backend (Windows x64)
        shell: pwsh
        run: |
          cd backend
          pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Flutter pub get
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter Windows app
        shell: pwsh
        run: |
          cd frontend
          flutter build windows --release

      - name: Copy backend into Flutter release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "frontend\build\windows\x64\runner\Release\bin" -Force
          Copy-Item -Path "backend\dist\kivo_backend" `
                    -Destination "frontend\build\windows\x64\runner\Release\bin\" `
                    -Recurse -Force

      - name: Download Web Assets Artifact
        uses: actions/download-artifact@v4
        with:
          name: kivo_web_assets
          path: web

      - name: Copy Web assets into backend folder
        shell: pwsh
        run: |
          Copy-Item -Path "web" `
                    -Destination "frontend\build\windows\x64\runner\Release\bin\kivo_backend\" `
                    -Recurse -Force

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "frontend\windows\installer.iss"

      - name: Rename installer to release filename
        shell: pwsh
        run: |
          Copy-Item "frontend\build\windows\KivoWorkspace-Setup.exe" `
                    "KivoWorkspace-Windows.exe" -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: KivoWorkspace-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 2 · Linux → .deb  .rpm  .AppImage
  # ============================================================
  build-linux:
    name: Linux (.deb/ .rpm/ .appimage)
    runs-on: ubuntu-latest
    needs: [build-web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.x'

      - name: Enable Linux desktop & install system dependencies
        run: |
          flutter config --enable-linux-desktop
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            alien wget rpm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies & PyInstaller
        run: |
          cd backend
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements_ci.txt
          .venv/bin/pip install pyinstaller

      - name: Build backend (Linux x86_64)
        run: |
          cd backend
          .venv/bin/pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Flutter pub get
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter Linux app
        run: |
          cd frontend
          flutter build linux --release

      - name: Copy backend into Flutter release bundle
        run: |
          mkdir -p frontend/build/linux/x64/release/bundle/bin
          cp -R backend/dist/kivo_backend frontend/build/linux/x64/release/bundle/bin/

      - name: Download Web Assets Artifact
        uses: actions/download-artifact@v4
        with:
          name: kivo_web_assets
          path: web

      - name: Copy Web assets into backend folder
        run: |
          cp -R web frontend/build/linux/x64/release/bundle/bin/kivo_backend/

      - name: Build .deb package
        run: |
          BUNDLE="frontend/build/linux/x64/release/bundle"
          PKG="deb_staging"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/share/kivo-workspace" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/pixmaps"
          cp -R "$BUNDLE/." "$PKG/usr/share/kivo-workspace/"
          printf '#!/bin/sh\nexec /usr/share/kivo-workspace/kivo_workspace "$@"\n' > "$PKG/usr/bin/kivo-workspace"
          chmod +x "$PKG/usr/bin/kivo-workspace"
          printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Kivo Workspace\nComment=Edge-first AI Knowledge Workspace\nExec=/usr/bin/kivo-workspace\nIcon=kivo-workspace\nCategories=Utility;\nTerminal=false\n' > "$PKG/usr/share/applications/kivo-workspace.desktop"
          cp frontend/assets/images/app_logo.png "$PKG/usr/share/pixmaps/kivo-workspace.png"
          printf 'Package: kivo-workspace\nVersion: 1.0.0\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: Kivo <support@kivo.com>\nDescription: Edge-first AI Knowledge Workspace\n An intelligent workspace that runs entirely on-device.\n' > "$PKG/DEBIAN/control"
          dpkg-deb --build "$PKG" KivoWorkspace-Linux.deb

      - name: Build .rpm package (via alien)
        run: |
          sudo alien --to-rpm --scripts KivoWorkspace-Linux.deb
          RPM_FILE=$(ls kivo-workspace*.rpm 2>/dev/null | head -1)
          if [ -z "$RPM_FILE" ]; then echo "ERROR: .rpm not found" && exit 1; fi
          mv "$RPM_FILE" KivoWorkspace-Linux.rpm

      - name: Build .AppImage
        run: |
          BUNDLE="frontend/build/linux/x64/release/bundle"
          APPDIR="AppDir"
          mkdir -p "$APPDIR"
          cp -R "$BUNDLE/." "$APPDIR/"
          printf '#!/bin/sh\nSELF=$(readlink -f "$0")\nHERE=$(dirname "$SELF")\nexec "$HERE/kivo_workspace" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Kivo Workspace\nComment=Edge-first AI Knowledge Workspace\nExec=AppRun\nIcon=kivo-workspace\nCategories=Utility;\nTerminal=false\n' > "$APPDIR/kivo-workspace.desktop"
          cp frontend/assets/images/app_logo.png "$APPDIR/kivo-workspace.png"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" KivoWorkspace-Linux.AppImage

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            KivoWorkspace-Linux.deb
            KivoWorkspace-Linux.rpm
            KivoWorkspace-Linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 3 · macOS (Intel, Silicon & Universal)
  # ============================================================
  build-macos:
    name: macOS (Intel, Silicon & Universal)
    runs-on: macos-14
    needs: [build-web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.x'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # --- 1. BUILD INTEL BACKEND (x86_64) ---
      - name: Setup Python (x86_64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies & PyInstaller (Intel)
        run: |
          cd backend
          python3 -m venv .venv_intel
          .venv_intel/bin/pip install --upgrade pip
          .venv_intel/bin/pip install -r requirements_ci.txt
          .venv_intel/bin/pip install pyinstaller
          .venv_intel/bin/pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py
          mkdir -p dist_intel
          cp -R dist/kivo_backend dist_intel/

      # --- 2. BUILD SILICON BACKEND (arm64) ---
      - name: Setup Python (arm64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'

      - name: Install dependencies & PyInstaller (Silicon)
        run: |
          cd backend
          rm -rf build dist
          python3 -m venv .venv_silicon
          .venv_silicon/bin/pip install --upgrade pip
          .venv_silicon/bin/pip install -r requirements_ci.txt
          .venv_silicon/bin/pip install pyinstaller
          .venv_silicon/bin/pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py
          mkdir -p dist_silicon
          cp -R dist/kivo_backend dist_silicon/

      # --- 3. BUILD FLUTTER APP & EMBED BACKENDS ---
      - name: Flutter pub get
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter macOS app (Creates Universal App by default)
        run: |
          cd frontend
          flutter build macos --release

      - name: Download Web Assets Artifact
        uses: actions/download-artifact@v4
        with:
          name: kivo_web_assets
          path: web

      # --- 4. PRODUCE SILICON ONLY DMG ---
      - name: Create macOS Silicon DMG
        run: |
          APP_DIR="frontend/build/macos/Build/Products/Release"
          APP="$APP_DIR/Kivo Workspace.app"
          STAGING_SILICON="dmg_staging_silicon"
          mkdir -p "$STAGING_SILICON"
          cp -R "$APP" "$STAGING_SILICON/"
          SILICON_APP="$STAGING_SILICON/Kivo Workspace.app"
          
          lipo -thin arm64 "$SILICON_APP/Contents/MacOS/Kivo Workspace" -output "$SILICON_APP/Contents/MacOS/Kivo Workspace"
          
          mkdir -p "$SILICON_APP/Contents/Resources/bin"
          cp -R backend/dist_silicon/kivo_backend "$SILICON_APP/Contents/Resources/bin/"
          cp -R web "$SILICON_APP/Contents/Resources/bin/kivo_backend/"
          
          codesign --force --deep --sign - "$SILICON_APP"
          ln -s /Applications "$STAGING_SILICON/Applications"
          hdiutil create \
            -fs HFS+ \
            -srcfolder "$STAGING_SILICON" \
            -volname "Kivo Workspace (Apple Silicon)" \
            -format UDZO \
            KivoWorkspace-macOS-Silicon.dmg

      # --- 5. PRODUCE INTEL ONLY DMG ---
      - name: Create macOS Intel DMG
        run: |
          APP_DIR="frontend/build/macos/Build/Products/Release"
          APP="$APP_DIR/Kivo Workspace.app"
          STAGING_INTEL="dmg_staging_intel"
          mkdir -p "$STAGING_INTEL"
          cp -R "$APP" "$STAGING_INTEL/"
          INTEL_APP="$STAGING_INTEL/Kivo Workspace.app"
          
          lipo -thin x86_64 "$INTEL_APP/Contents/MacOS/Kivo Workspace" -output "$INTEL_APP/Contents/MacOS/Kivo Workspace"
          
          mkdir -p "$INTEL_APP/Contents/Resources/bin"
          cp -R backend/dist_intel/kivo_backend "$INTEL_APP/Contents/Resources/bin/"
          cp -R web "$INTEL_APP/Contents/Resources/bin/kivo_backend/"
          
          codesign --force --deep --sign - "$INTEL_APP"
          ln -s /Applications "$STAGING_INTEL/Applications"
          hdiutil create \
            -fs HFS+ \
            -srcfolder "$STAGING_INTEL" \
            -volname "Kivo Workspace (Intel)" \
            -format UDZO \
            KivoWorkspace-macOS-Intel.dmg

      # --- 6. PRODUCE UNIVERSAL DMG ---
      - name: Create macOS Universal DMG
        run: |
          APP_DIR="frontend/build/macos/Build/Products/Release"
          APP="$APP_DIR/Kivo Workspace.app"
          STAGING_UNIVERSAL="dmg_staging_universal"
          mkdir -p "$STAGING_UNIVERSAL"
          cp -R "$APP" "$STAGING_UNIVERSAL/"
          UNIVERSAL_APP="$STAGING_UNIVERSAL/Kivo Workspace.app"
          
          mkdir -p "$UNIVERSAL_APP/Contents/Resources/bin/kivo_backend_silicon/kivo_backend"
          mkdir -p "$UNIVERSAL_APP/Contents/Resources/bin/kivo_backend_intel/kivo_backend"
          cp -R backend/dist_silicon/kivo_backend/. "$UNIVERSAL_APP/Contents/Resources/bin/kivo_backend_silicon/kivo_backend/"
          cp -R backend/dist_intel/kivo_backend/. "$UNIVERSAL_APP/Contents/Resources/bin/kivo_backend_intel/kivo_backend/"
          cp -R web "$UNIVERSAL_APP/Contents/Resources/bin/kivo_backend_silicon/kivo_backend/"
          cp -R web "$UNIVERSAL_APP/Contents/Resources/bin/kivo_backend_intel/kivo_backend/"
          
          codesign --force --deep --sign - "$UNIVERSAL_APP"
          ln -s /Applications "$STAGING_UNIVERSAL/Applications"
          hdiutil create \
            -fs HFS+ \
            -srcfolder "$STAGING_UNIVERSAL" \
            -volname "Kivo Workspace" \
            -format UDZO \
            KivoWorkspace-macOS-Universal.dmg

      # --- 7. UPLOAD ALL THREE DMGs ---
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            KivoWorkspace-macOS-Silicon.dmg
            KivoWorkspace-macOS-Intel.dmg
            KivoWorkspace-macOS-Universal.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
