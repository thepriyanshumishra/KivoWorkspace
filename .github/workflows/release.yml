name: Kivo Workspace Auto-Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow only when version tags are pushed (e.g. v1.0.0)

permissions:
  contents: write

jobs:
  # --- WINDOWS BUILD JOB ---
  build-windows:
    name: Build Windows Release Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.x'

      - name: Enable Desktop Support
        run: |
          flutter config --enable-windows-desktop

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PyInstaller & Backend Dependencies
        shell: pwsh
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -r requirements_ci.txt
          python -m pip install pyinstaller

      - name: Compile Backend with PyInstaller
        shell: pwsh
        run: |
          cd backend
          pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Fetch Dart Packages
        run: |
          cd frontend
          flutter pub get

      - name: Build Windows App
        shell: pwsh
        run: |
          cd frontend
          flutter build windows --release
          New-Item -ItemType Directory -Path build/windows/x64/runner/Release/bin -Force
          Copy-Item -Path ../backend/dist/kivo_backend -Destination build/windows/x64/runner/Release/bin/ -Recurse -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss

      - name: Publish Artifacts to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            KivoWorkspace-Windows-Setup.exe
          fail_on_unmatched_files: false
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- LINUX BUILD JOB ---
  build-linux:
    name: Build Linux Release Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.x'

      - name: Enable Desktop Support
        run: |
          flutter config --enable-linux-desktop

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PyInstaller & Backend Dependencies
        run: |
          cd backend
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements_ci.txt
          .venv/bin/pip install pyinstaller

      - name: Compile Backend with PyInstaller
        run: |
          cd backend
          .venv/bin/pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Fetch Dart Packages
        run: |
          cd frontend
          flutter pub get

      - name: Build Linux App
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev alien wget

          cd frontend
          flutter build linux --release
          mkdir -p build/linux/x64/release/bundle/bin
          cp -R ../backend/dist/kivo_backend build/linux/x64/release/bundle/bin/

          # 1. Build .deb package
          mkdir -p debian/DEBIAN
          mkdir -p debian/usr/share/kivo-workspace
          mkdir -p debian/usr/bin
          cp -R build/linux/x64/release/bundle/* debian/usr/share/kivo-workspace/
          echo '#!/bin/sh' > debian/usr/bin/kivo-workspace
          echo 'exec /usr/share/kivo-workspace/kivo_workspace "$@"' >> debian/usr/bin/kivo-workspace
          chmod +x debian/usr/bin/kivo-workspace
          echo "Package: kivo-workspace" > debian/DEBIAN/control
          echo "Version: 1.0.0" >> debian/DEBIAN/control
          echo "Section: utils" >> debian/DEBIAN/control
          echo "Priority: optional" >> debian/DEBIAN/control
          echo "Architecture: amd64" >> debian/DEBIAN/control
          echo "Maintainer: Kivo <support@kivo.com>" >> debian/DEBIAN/control
          echo "Description: Edge-first AI Knowledge Workspace" >> debian/DEBIAN/control
          dpkg-deb --build debian ../KivoWorkspace-Linux.deb

          # 2. Build .rpm package (using alien to convert deb to rpm)
          sudo alien -r ../KivoWorkspace-Linux.deb
          mv kivo-workspace-*.rpm ../KivoWorkspace-Linux.rpm || mv kivo-workspace_*.rpm ../KivoWorkspace-Linux.rpm || true

          # 3. Build .AppImage package
          mkdir -p AppDir
          cp -R build/linux/x64/release/bundle/* AppDir/
          
          cat << 'EOF' > AppDir/AppRun
#!/bin/sh
SELF=$(readlink -f "$0")
HERE=$(dirname "$SELF")
exec "$HERE/kivo_workspace" "$@"
EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/kivo-workspace.desktop
[Desktop Entry]
Version=1.0
Type=Application
Name=Kivo Workspace
Comment=Edge-first AI Knowledge Workspace
Exec=AppRun
Icon=kivo-workspace
Categories=Utility;
EOF

          cp assets/images/app_logo.png AppDir/kivo-workspace.png

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O ../appimagetool
          chmod +x ../appimagetool
          ARCH=x86_64 ../appimagetool --appimage-extract-and-run AppDir ../KivoWorkspace-Linux.AppImage

      - name: Publish Artifacts to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            KivoWorkspace-Linux.deb
            KivoWorkspace-Linux.rpm
            KivoWorkspace-Linux.AppImage
          fail_on_unmatched_files: false
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- MAC OS INTEL BUILD JOB ---
  build-macos-intel:
    name: Build macOS Intel Release Package
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.x'

      - name: Enable Desktop Support
        run: |
          flutter config --enable-macos-desktop

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PyInstaller & Backend Dependencies (Intel)
        run: |
          cd backend
          arch -x86_64 python3 -m venv .venv
          arch -x86_64 .venv/bin/pip install --upgrade pip
          arch -x86_64 .venv/bin/pip install -r requirements_ci.txt
          arch -x86_64 .venv/bin/pip install pyinstaller

      - name: Compile Backend with PyInstaller (Intel)
        run: |
          cd backend
          arch -x86_64 .venv/bin/pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Upload Intel Backend Artifact
        uses: actions/upload-artifact@v3
        with:
          name: macos-intel-backend
          path: backend/dist/kivo_backend/

      - name: Fetch Dart Packages
        run: |
          cd frontend
          flutter pub get

      - name: Build macOS App & Intel DMG
        run: |
          cd frontend
          flutter build macos --release
          mkdir -p "build/macos/Build/Products/Release/Kivo Workspace.app/Contents/Resources/bin"
          cp -R ../backend/dist/kivo_backend "build/macos/Build/Products/Release/Kivo Workspace.app/Contents/Resources/bin/"
          
          mkdir -p build/macos/Build/Products/Release/dmg_staging
          cp -R "build/macos/Build/Products/Release/Kivo Workspace.app" build/macos/Build/Products/Release/dmg_staging/
          ln -s /Applications build/macos/Build/Products/Release/dmg_staging/Applications

          hdiutil create -fs HFS+ -srcfolder build/macos/Build/Products/Release/dmg_staging \
            -volname "Kivo Workspace" ../KivoWorkspace-macOS-Intel.dmg

      - name: Publish Artifacts to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            KivoWorkspace-macOS-Intel.dmg
          fail_on_unmatched_files: false
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- MAC OS SILICON & UNIVERSAL BUILD JOB ---
  build-macos-silicon:
    name: Build macOS Silicon & Universal Release Packages
    runs-on: macos-14
    needs: build-macos-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.x'

      - name: Enable Desktop Support
        run: |
          flutter config --enable-macos-desktop

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PyInstaller & Backend Dependencies (Silicon)
        run: |
          cd backend
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements_ci.txt
          .venv/bin/pip install pyinstaller

      - name: Compile Backend with PyInstaller (Silicon)
        run: |
          cd backend
          .venv/bin/pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Fetch Dart Packages
        run: |
          cd frontend
          flutter pub get

      - name: Build macOS App & Silicon DMG
        run: |
          cd frontend
          flutter build macos --release
          mkdir -p "build/macos/Build/Products/Release/Kivo Workspace.app/Contents/Resources/bin"
          cp -R ../backend/dist/kivo_backend "build/macos/Build/Products/Release/Kivo Workspace.app/Contents/Resources/bin/"
          
          mkdir -p build/macos/Build/Products/Release/dmg_staging
          cp -R "build/macos/Build/Products/Release/Kivo Workspace.app" build/macos/Build/Products/Release/dmg_staging/
          ln -s /Applications build/macos/Build/Products/Release/dmg_staging/Applications

          hdiutil create -fs HFS+ -srcfolder build/macos/Build/Products/Release/dmg_staging \
            -volname "Kivo Workspace" ../KivoWorkspace-macOS-Silicon.dmg

      - name: Download Intel Backend Artifact
        uses: actions/download-artifact@v3
        with:
          name: macos-intel-backend
          path: backend/dist/kivo_backend_intel

      - name: Create Universal macOS Backend
        run: |
          python3 backend/scripts/merge_universal.py \
            backend/dist/kivo_backend \
            backend/dist/kivo_backend_intel \
            backend/dist/kivo_backend_universal

      - name: Build Universal macOS App & DMG
        run: |
          cd frontend
          mkdir -p build/macos/Build/Products/Release/dmg_staging_universal
          cp -R "build/macos/Build/Products/Release/Kivo Workspace.app" build/macos/Build/Products/Release/dmg_staging_universal/
          
          # Replace backend inside Universal app bundle with the merged universal backend folder
          rm -rf "build/macos/Build/Products/Release/dmg_staging_universal/Kivo Workspace.app/Contents/Resources/bin/kivo_backend"
          cp -R ../backend/dist/kivo_backend_universal "build/macos/Build/Products/Release/dmg_staging_universal/Kivo Workspace.app/Contents/Resources/bin/kivo_backend"
          
          # Create symbolic link to /Applications
          ln -s /Applications build/macos/Build/Products/Release/dmg_staging_universal/Applications

          hdiutil create -fs HFS+ -srcfolder build/macos/Build/Products/Release/dmg_staging_universal \
            -volname "Kivo Workspace" ../KivoWorkspace-macOS-Universal.dmg

      - name: Publish Artifacts to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            KivoWorkspace-macOS-Silicon.dmg
            KivoWorkspace-macOS-Universal.dmg
          fail_on_unmatched_files: false
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
