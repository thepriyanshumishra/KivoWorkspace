name: Kivo Workspace Auto-Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow only when version tags are pushed (e.g. v1.0.0)

permissions:
  contents: write

jobs:
  release:
    name: Build Release Package for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            artifact_name: KivoWorkspace-Windows-x64.zip
          - platform: linux-x64
            os: ubuntu-latest
            artifact_name: KivoWorkspace-Linux-x64.tar.gz
          - platform: macos-x64
            os: [self-hosted, macos, x64]
            artifact_name: KivoWorkspace-macOS-Intel.zip
          - platform: macos-arm64
            os: macos-14
            artifact_name: KivoWorkspace-macOS-Silicon.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # --- 1. Setup SDKs ---
      - name: Setup Java (required for Flutter build tools)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.x'

      - name: Enable Desktop Support
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop

      # Setup Python — skipped for self-hosted macOS x64 (uses system Python 3 at /usr/local/bin/python3)
      - name: Setup Python
        if: matrix.platform != 'macos-x64'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Verify system Python is available on self-hosted macOS Intel runner
      - name: Verify System Python (macOS self-hosted only)
        if: matrix.platform == 'macos-x64'
        run: |
          python3 --version
          pip3 --version

      # --- 2. Build Python Backend ---

      # Unix (Linux + both macOS): use a venv to avoid PEP 668 externally-managed-environment
      # error on Homebrew Python (macOS). Call venv binaries directly — no shell activation needed.
      - name: Install PyInstaller & Backend Dependencies (Unix)
        if: matrix.platform != 'windows-x64'
        run: |
          cd backend
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements_ci.txt
          .venv/bin/pip install pyinstaller

      # Windows: use python/pip (provided by actions/setup-python above)
      - name: Install PyInstaller & Backend Dependencies (Windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -r requirements_ci.txt
          python -m pip install pyinstaller

      - name: Compile Backend with PyInstaller (Unix)
        if: matrix.platform != 'windows-x64'
        run: |
          cd backend
          .venv/bin/pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      - name: Compile Backend with PyInstaller (Windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          cd backend
          pyinstaller --noconfirm --onedir --noconsole --name "kivo_backend" main.py

      # --- 3. Build Flutter Frontend ---
      - name: Fetch Dart Packages
        run: |
          cd frontend
          flutter pub get

      # macOS Build & Bundling
      - name: Build macOS App
        if: startsWith(matrix.platform, 'macos')
        run: |
          cd frontend
          flutter build macos --release

          # Create Resources/bin folder inside the app bundle
          mkdir -p build/macos/Build/Products/Release/kivo_workspace.app/Contents/Resources/bin

          # Copy compiled kivo_backend into the app bundle
          cp -R ../backend/dist/kivo_backend build/macos/Build/Products/Release/kivo_workspace.app/Contents/Resources/bin/

          # Create DMG disk image
          if [ "${{ matrix.platform }}" = "macos-x64" ]; then
            hdiutil create -fs HFS+ -srcfolder build/macos/Build/Products/Release/kivo_workspace.app \
              -volname "Kivo Workspace" ../KivoWorkspace-macOS-Intel.dmg
          else
            hdiutil create -fs HFS+ -srcfolder build/macos/Build/Products/Release/kivo_workspace.app \
              -volname "Kivo Workspace" ../KivoWorkspace-macOS-Silicon.dmg
          fi

      # Windows Build & Bundling
      # NOTE: Flutter 3.x outputs to build/windows/x64/runner/Release/ (not build/windows/runner/Release/)
      - name: Build Windows App
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          cd frontend
          flutter build windows --release

          # Create bin folder inside the Flutter 3.x output directory
          New-Item -ItemType Directory -Path build/windows/x64/runner/Release/bin -Force

          # Copy compiled backend into bin
          Copy-Item -Path ../backend/dist/kivo_backend -Destination build/windows/x64/runner/Release/bin/ -Recurse -Force

          # Compile Inno Setup installer
          # ISCC sets working dir to the .iss file location (frontend/windows/),
          # so installer.iss paths are relative to frontend/windows/
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss

      # Linux Build & Bundling
      - name: Build Linux App
        if: matrix.platform == 'linux-x64'
        run: |
          # Install Linux desktop build requirements
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

          cd frontend
          flutter build linux --release

          # Create bin folder alongside the linux binary bundle
          mkdir -p build/linux/x64/release/bundle/bin

          # Copy compiled backend into bin
          cp -R ../backend/dist/kivo_backend build/linux/x64/release/bundle/bin/

          # Build .deb package
          mkdir -p debian/DEBIAN
          mkdir -p debian/usr/share/kivo-workspace
          mkdir -p debian/usr/bin
          cp -R build/linux/x64/release/bundle/* debian/usr/share/kivo-workspace/
          echo '#!/bin/sh' > debian/usr/bin/kivo-workspace
          echo 'exec /usr/share/kivo-workspace/kivo_workspace "$@"' >> debian/usr/bin/kivo-workspace
          chmod +x debian/usr/bin/kivo-workspace
          echo "Package: kivo-workspace" > debian/DEBIAN/control
          echo "Version: 1.0.0" >> debian/DEBIAN/control
          echo "Section: utils" >> debian/DEBIAN/control
          echo "Priority: optional" >> debian/DEBIAN/control
          echo "Architecture: amd64" >> debian/DEBIAN/control
          echo "Maintainer: Kivo <support@kivo.com>" >> debian/DEBIAN/control
          echo "Description: Edge-first AI Knowledge Workspace" >> debian/DEBIAN/control
          dpkg-deb --build debian ../KivoWorkspace-Linux.deb

      # --- 4. Package Artifacts ---
      - name: Package macOS App Bundle
        if: startsWith(matrix.platform, 'macos')
        run: |
          cd frontend/build/macos/Build/Products/Release
          zip -r ../../../../../../${{ matrix.artifact_name }} kivo_workspace.app

      # Flutter 3.x Windows output: build/windows/x64/runner/Release/
      # From that folder: 6 levels up = workspace root, 3 levels up = build/windows/ (Inno Setup output dir)
      - name: Package Windows Executable Folder
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          cd frontend/build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../../../../${{ matrix.artifact_name }} -Force
          Copy-Item -Path ../../../KivoWorkspace-Setup.exe -Destination ../../../../../../KivoWorkspace-Windows-Setup.exe -Force

      - name: Package Linux Binary Bundle
        if: matrix.platform == 'linux-x64'
        run: |
          cd frontend/build/linux/x64/release/bundle
          tar -czf ../../../../../../${{ matrix.artifact_name }} *

      # --- 5. Upload to GitHub Releases ---
      - name: Publish Artifacts to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.artifact_name }}
            KivoWorkspace-Windows-Setup.exe
            KivoWorkspace-macOS-Intel.dmg
            KivoWorkspace-macOS-Silicon.dmg
            KivoWorkspace-Linux.deb
          fail_on_unmatched_files: false
          draft: true # Creates a draft release so you can review it before making it public
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
